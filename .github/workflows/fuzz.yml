name: Parser fuzzing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      run_fuzzing:
        description: Run the bounded AFL++ campaigns after corpus replay
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
      - run: dotnet restore --locked-mode
        working-directory: src
      - run: dotnet build FrontierSharp.Fuzz/FrontierSharp.Fuzz.csproj --no-restore --configuration Release
        working-directory: src
      - run: |
          for target in sui resindex pickle world; do
            dotnet run --project FrontierSharp.Fuzz --no-build --configuration Release -- replay "$target" "FrontierSharp.Fuzz/corpus/$target"
          done
        working-directory: src

  fuzz:
    if: github.event_name == 'schedule' || inputs.run_fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: parser-fuzz-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: [sui, resindex, pickle, world]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
      - run: sudo apt-get update && sudo apt-get install -y afl++
      - run: dotnet restore --locked-mode
        working-directory: src
      - run: dotnet publish FrontierSharp.Fuzz/FrontierSharp.Fuzz.csproj --no-restore -c Debug --self-contained false
        working-directory: src
      - name: Instrument parser dependencies
        run: |
          dotnet tool install --tool-path /tmp/sharpfuzz SharpFuzz.CommandLine --version 2.3.0
          publish_directory=src/FrontierSharp.Fuzz/bin/Debug/net10.0/publish
          for assembly in "$publish_directory"/*.dll; do
            case "$(basename "$assembly")" in
              FrontierSharp.Fuzz.dll|SharpFuzz.dll|SharpFuzz.Common.dll|System.*.dll) continue ;;
            esac
            /tmp/sharpfuzz/sharpfuzz "$assembly"
          done
      - name: Run bounded AFL++ campaign
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set +e
          export DOTNET_ReadyToRun=0
          export DOTNET_TieredCompilation=0
          export DOTNET_ROLL_FORWARD=Major
          export AFL_SKIP_BIN_CHECK=1
          export AFL_SKIP_CPUFREQ=1
          export AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1
          mkdir -p /tmp/afl-out
          timeout --preserve-status 1800 afl-fuzz -V 1800 -m none \
            -i "src/FrontierSharp.Fuzz/corpus/$TARGET" \
            -o "/tmp/afl-out/$TARGET" -- \
            dotnet "src/FrontierSharp.Fuzz/bin/Debug/net10.0/publish/FrontierSharp.Fuzz.dll" fuzz "$TARGET"
          status=$?

          mkdir -p "fuzz-artifacts/$TARGET"
          printf 'dotnet FrontierSharp.Fuzz.dll replay %s <artifact-directory>\n' "$TARGET" > "fuzz-artifacts/$TARGET/REPLAY.txt"
          for kind in crashes hangs; do
            source="/tmp/afl-out/$TARGET/default/$kind"
            destination="fuzz-artifacts/$TARGET/$kind"
            if [ -d "$source" ]; then
              mkdir -p "$destination"
              find "$source" -maxdepth 1 -type f ! -name README.txt -exec cp {} "$destination" \;
            fi
          done

          # AFL++ may return 124 when the outer bound expires; that is an expected,
          # explicit campaign termination. Preserve other failures for investigation.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Upload sanitized AFL++ findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afl-${{ matrix.target }}-findings
          path: fuzz-artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
