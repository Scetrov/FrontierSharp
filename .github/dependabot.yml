version: 2
updates:
  # NuGet — main solution/package dependencies.
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      nuget-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # NuGet — example project dependencies.
  - package-ecosystem: "nuget"
    directory: "/examples/AssemblyWatcherExample"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      nuget-examples-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      nuget-examples-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions — workflow action dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Docker — command-line image dependencies.
  - package-ecosystem: "docker"
    directory: "/src/FrontierSharp.CommandLine"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
